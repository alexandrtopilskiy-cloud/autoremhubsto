name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sto
          POSTGRES_PASSWORD: sto
          POSTGRES_DB: sto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sto" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sto:sto@localhost:5432/sto_test
      TEST_DATABASE_URL: postgresql://sto:sto@localhost:5432/sto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build Windows workstation pairing app
        working-directory: workstation
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -H=windowsgui" -o ../public/downloads/AutoRemHub-PC.exe .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: AutoRemHub-PC-windows-x64
          path: public/downloads/AutoRemHub-PC.exe
          if-no-files-found: error

  windows-smoke:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AutoRemHub-PC-windows-x64
      - name: Open pairing dialog and check input
        shell: pwsh
        run: ./workstation/smoke.ps1 -Executable ./AutoRemHub-PC.exe
